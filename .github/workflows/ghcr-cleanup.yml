name: GHCR cleanup
on:
  workflow_dispatch:
    inputs:
      dry_run: { description: "Preview only", type: boolean, default: true }
permissions: { packages: write }
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: Exploitacious
          packages: ivantsov.tech
          delete-untagged: true
          keep-n-tagged: 10
          exclude-tags: latest
          dry-run: ${{ inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}
